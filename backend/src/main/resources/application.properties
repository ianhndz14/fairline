spring.application.name=fairline

# Local secrets live in backend/.env (git-ignored); see .env.example.
spring.config.import=optional:file:.env[.properties]

# Hosting platforms set PORT and the DB_* parts; locally the defaults apply.
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fairline}}
spring.datasource.username=${DB_USERNAME:fairline}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Validation and framework errors come back as RFC 9457 problem+json, like the API's own errors.
spring.mvc.problemdetails.enabled=true

# Origins allowed to call /api from a browser. Empty in development, where Vite proxies /api.
fairline.cors.allowed-origins=${CORS_ORIGINS:}

fairline.results.base-url=https://football-data.co.uk
fairline.results.refresh-interval=PT6H

fairline.kalshi.base-url=https://external-api.kalshi.com/trade-api/v2
fairline.kalshi.refresh-interval=PT10M

# Minimum model-minus-market probability (0.03 = 3 percentage points) to log an opportunity.
fairline.edge.threshold=0.03
