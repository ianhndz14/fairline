spring.application.name=fairline

# Local secrets live in backend/.env (git-ignored); see .env.example.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fairline}
spring.datasource.username=${DB_USERNAME:fairline}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

fairline.results.base-url=https://football-data.co.uk
fairline.results.refresh-interval=PT6H

fairline.kalshi.base-url=https://external-api.kalshi.com/trade-api/v2
fairline.kalshi.refresh-interval=PT10M

# Minimum model-minus-market probability (0.03 = 3 percentage points) to log an opportunity.
fairline.edge.threshold=0.03
